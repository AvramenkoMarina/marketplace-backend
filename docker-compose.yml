services:
  postgres:
    image: postgres:16-alpine
    container_name: marketplace-postgres
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace_secret
      POSTGRES_DB: marketplace
    ports:
      - '5433:5432'
    volumes:
      - marketplace_pg:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U marketplace -d marketplace']
      interval: 3s
      timeout: 3s
      retries: 20

  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0
    container_name: marketplace-pgbouncer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '6432:6432'
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-p', '6432']
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.2-management
    container_name: marketplace-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - marketplace_rabbit:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_running']
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 30s

  redis-cache:
    image: redis:7.4-alpine
    container_name: marketplace-redis-cache
    command:
      - redis-server
      - --maxmemory
      - 32mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
    ports:
      - '16379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  redis-queue:
    image: redis:7.4-alpine
    container_name: marketplace-redis-queue
    command:
      - redis-server
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - yes
      - --appendfsync
      - everysec
    ports:
      - '16380:6379'
    volumes:
      - marketplace_redis_queue:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  pact-broker:
    image: pactfoundation/pact-broker:2.143.0-pactbroker2.121.0
    container_name: marketplace-pact-broker
    ports:
      - '9292:9292'
    environment:
      PACT_BROKER_DATABASE_ADAPTER: sqlite
      PACT_BROKER_DATABASE_NAME: /tmp/pact_broker.sqlite3
      PACT_BROKER_BASE_URL: http://127.0.0.1:9292
      PACT_BROKER_LOG_LEVEL: INFO
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'ruby -rnet/http -e ''res=Net::HTTP.get_response(URI("http://127.0.0.1:9292/diagnostic/status/heartbeat")); abort unless res.is_a?(Net::HTTPSuccess)''',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  minio:
    # Upstream minio/minio and quay.io/minio/minio no longer pull anonymously.
    # SILO is a MinIO-compatible server: same S3 API, same MINIO_ROOT_* env.
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    container_name: marketplace-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hw26user
      MINIO_ROOT_PASSWORD: hw26secretpass
    ports:
      - '22650:9000'
    # tmpfs smaller than 1g dies mid-demo (multipart parts are 5 MiB each).
    tmpfs:
      - /data:size=1g
    healthcheck:
      test: ['CMD', 'silo', 'healthcheck', 'ready']
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  marketplace_pg:
  marketplace_rabbit:
  marketplace_redis_queue:
