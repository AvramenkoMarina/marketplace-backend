services:
  postgres:
    image: postgres:16-alpine
    container_name: marketplace-postgres
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace_secret
      POSTGRES_DB: marketplace
    ports:
      - '5433:5432'
    volumes:
      - marketplace_pg:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U marketplace -d marketplace']
      interval: 3s
      timeout: 3s
      retries: 20

  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0
    container_name: marketplace-pgbouncer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '6432:6432'
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-p', '6432']
      interval: 3s
      timeout: 3s
      retries: 20

  pact-broker:
    image: pactfoundation/pact-broker:2.143.0-pactbroker2.121.0
    container_name: marketplace-pact-broker
    ports:
      - '9292:9292'
    environment:
      PACT_BROKER_DATABASE_ADAPTER: sqlite
      PACT_BROKER_DATABASE_NAME: /tmp/pact_broker.sqlite3
      PACT_BROKER_BASE_URL: http://127.0.0.1:9292
      PACT_BROKER_LOG_LEVEL: INFO
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'ruby -rnet/http -e ''res=Net::HTTP.get_response(URI("http://127.0.0.1:9292/diagnostic/status/heartbeat")); abort unless res.is_a?(Net::HTTPSuccess)''',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  marketplace_pg:
