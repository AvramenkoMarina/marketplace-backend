services:
  postgres:
    image: postgres:16-alpine
    container_name: marketplace-postgres
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace_secret
      POSTGRES_DB: marketplace
    ports:
      - '5433:5432'
    volumes:
      - marketplace_pg:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U marketplace -d marketplace']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  marketplace_pg:
