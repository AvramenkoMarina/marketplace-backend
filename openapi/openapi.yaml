openapi: 3.0.3
info:
  title: Marketplace API
  version: 1.0.0
  description: >
    Контракт Marketplace API для курсового проєкту.
    Гроші в цілих копійках (integer). Пагінація — cursor.
    Створення замовлень — з обовʼязковим Idempotency-Key.
servers:
  - url: http://localhost:3000
    description: Local development
security: []
tags:
  - name: products
    description: Каталог товарів
  - name: orders
    description: Замовлення покупців
paths:
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: Список товарів з cursor-пагінацією
      description: >
        Повертає сторінку товарів. Курсор — непрозорий токен;
        клієнт не повинен його інтерпретувати.
      parameters:
        - name: limit
          in: query
          required: false
          description: Максимальна кількість елементів на сторінці
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: >
            Непрозорий токен пагінації (opaque cursor).
            Не інтерпретуйте на клієнті — передавайте як є з next_cursor.
          schema:
            type: string
      responses:
        '200':
          description: Сторінка товарів
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          description: Невалідний запит (наприклад, поганий cursor)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Отримати товар за id
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Товар знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Товар не знайдено
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: Список замовлень з cursor-пагінацією
      parameters:
        - name: limit
          in: query
          required: false
          description: Максимальна кількість елементів на сторінці
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: >
            Непрозорий токен пагінації (opaque cursor).
            Не інтерпретуйте на клієнті — передавайте як є з next_cursor.
          schema:
            type: string
      responses:
        '200':
          description: Сторінка замовлень
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '400':
          description: Невалідний запит
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    post:
      operationId: createOrder
      tags: [orders]
      summary: Створити замовлення
      description: >
        Створює замовлення. Повтор з тим самим Idempotency-Key і тим самим
        тілом повертає збережену відповідь без дубліката.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >
            Ключ ідемпотентності створення. Той самий ключ і те саме тіло
            повертають ту саму відповідь (без другого списання / дубліката).
            Той самий ключ з іншим тілом — конфлікт семантики (422).
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrder'
      responses:
        '201':
          description: Замовлення створено (або replay збереженої відповіді)
          headers:
            Location:
              description: URI створеного замовлення
              schema:
                type: string
            Idempotency-Replay:
              description: true, якщо відповідь відтворена з кешу ідемпотентності
              schema:
                type: string
                enum: ['true']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Невалідний запит або відсутній Idempotency-Key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Один із товарів не знайдено
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Той самий Idempotency-Key використано з іншим тілом
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Отримати замовлення за id
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Замовлення знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Замовлення не знайдено
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  parameters:
    ProductId:
      name: id
      in: path
      required: true
      description: Ідентифікатор товару
      schema:
        type: string
    OrderId:
      name: id
      in: path
      required: true
      description: Ідентифікатор замовлення
      schema:
        type: string

  schemas:
    Problem:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri
          description: URI типу помилки
        title:
          type: string
          description: Коротка назва помилки
        status:
          type: integer
          description: HTTP-код статусу
        detail:
          type: string
          description: Що саме пішло не так
        instance:
          type: string
          description: Посилання на конкретний випадок (зазвичай path запиту)

    Product:
      type: object
      required: [id, name, price_cents]
      properties:
        id:
          type: string
        name:
          type: string
        price_cents:
          type: integer
          minimum: 0
          description: Ціна в копійках (ціле число)

    ProductPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        next_cursor:
          type: string
          nullable: true
          description: Курсор наступної сторінки; null — сторінок більше немає

    OrderItem:
      type: object
      required: [product_id, qty, unit_price_cents]
      properties:
        product_id:
          type: string
        qty:
          type: integer
          minimum: 1
        unit_price_cents:
          type: integer
          minimum: 0

    CreateOrderItem:
      type: object
      required: [product_id, qty]
      properties:
        product_id:
          type: string
        qty:
          type: integer
          minimum: 1

    CreateOrder:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateOrderItem'

    Order:
      type: object
      required: [id, items, total_cents, status]
      properties:
        id:
          type: string
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
        total_cents:
          type: integer
          minimum: 0
          description: Сума замовлення в копійках (ціле число)
        status:
          type: string
          enum: [pending, paid, cancelled]

    OrderPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        next_cursor:
          type: string
          nullable: true
          description: Курсор наступної сторінки; null — сторінок більше немає
